services:
  devops-app:
    image: ${FRONTEND_IMAGE:-devops-lab:v3}
    container_name: devops-app-compose
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    image: ${BACKEND_IMAGE:-devops-backend:v2}
    container_name: devops-backend-compose
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
