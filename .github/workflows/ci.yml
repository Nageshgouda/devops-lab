name: DevOps Lab CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          ls -la
          ls -la app
          ls -la backend

      - name: Build backend image
        run: docker build -t devops-backend:test ./backend

      - name: Build frontend image
        run: docker build -t devops-app:test .
