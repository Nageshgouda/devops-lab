name: DevOps Lab CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          ls -la
          ls -la app
          ls -la backend

      - name: Build backend image
        run: docker build -t devops-backend:test ./backend

      - name: Build frontend image
        run: docker build -t devops-app:test .
 
      - name: Create CI environment file
        run: |
          echo "APP_MESSAGE=Hello from CI" > .env
          echo "APP_PORT=5000" >> .env

      - name: Start application
        run: |
          BACKEND_IMAGE=devops-backend:test \
          FRONTEND_IMAGE=devops-app:test \
          docker compose up -d

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if docker inspect --format '{{.State.Health.Status}}' devops-backend-compose | grep -q healthy; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend..."
            sleep 2
          done
          echo "Backend did not become healthy"
          docker compose logs backend
          exit 1

      - name: Test frontend
        run: curl -f http://localhost:8081

      - name: Test backend API
        run: curl -f http://localhost:8081/api/

      - name: Stop application
        if: always()
        run: docker compose down
